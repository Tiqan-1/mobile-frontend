name: CI

on: [push, pull_request]

jobs:
  checks:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # The point of --frozen-lockfile: it's what catches a regression back
      # into a machine-local (file:) dependency (docs/tasks/T0-hygiene.md).
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint (rules)
        run: yarn lint:rules

      # Ratchet baselines, not gates yet — see docs/tasks/T0-hygiene.md.
      # lint:type-check: only ~20 of ~150 residual tsc errors live in files
      # this pass touches; the rest are owned by later briefs (T2b/T2d/T2e/
      # T2f). lint:format: 85 pre-existing files fail prettier@3's stricter
      # formatting (a version bump this pass made, not new code), spread
      # across the same later briefs' files — reformatting them here would
      # be exactly the "large mechanical churn across files owned by later
      # briefs" this pass was told to avoid.
      - name: Type-check (non-blocking ratchet)
        run: yarn lint:type-check
        continue-on-error: true

      - name: Format check (non-blocking ratchet)
        run: yarn lint:format
        continue-on-error: true

      - name: Test
        run: yarn test --ci --reporters=default --reporters=jest-junit

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml

  android-build:
    name: Android debug build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # android/ is generated by `expo prebuild` and gitignored — it does
      # not exist on a fresh checkout (CLAUDE.md §0.3/§2). Must run before
      # any Gradle step.
      - name: Prebuild native Android project
        run: npx expo prebuild -p android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # iOS is intentionally left out of CI for now — it needs a macOS runner
  # and signing setup that hasn't been decided yet. Follow-up, not scoped
  # to T0 (docs/tasks/T0-hygiene.md Part E).
